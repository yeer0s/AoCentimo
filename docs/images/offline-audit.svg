  <text x="34" y="88" font-size="19" fill="#e6edea" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-weight="600">$ python scripts/offline_audit.py --selftest</text><text x="34" y="118" font-size="19" fill="#8fe3c6" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-weight="400">  direct import          caught</text><text x="34" y="148" font-size="19" fill="#8fe3c6" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-weight="400">  builtin eval           caught</text><text x="34" y="178" font-size="19" fill="#8fe3c6" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-weight="400">  re.compile must NOT trip it   ok</text><text x="34" y="208" font-size="19" fill="#3fd9b0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-weight="600">SELF-TEST: PASS</text><text x="34" y="238" font-size="19" fill="#000" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-weight="400"></text><text x="34" y="268" font-size="19" fill="#e6edea" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-weight="600">$ python scripts/offline_audit.py</text><text x="34" y="298" font-size="19" fill="#a9bdb6" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-weight="400">  8 Python files, 0 networking/subprocess/ctypes imports,</text><text x="34" y="328" font-size="19" fill="#a9bdb6" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-weight="400">  0 builtin eval/exec/__import__ calls</text><text x="34" y="358" font-size="19" fill="#3fd9b0" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-weight="600">OFFLINE AUDIT: PASS - nothing here can transmit your data.</text>
